plugins {
id 'com.android.application'
}

android {
namespace "hidden.protectedwp.safespace"
compileSdk 35

lint {
        checkReleaseBuilds false
    }

defaultConfig {  
    applicationId "hidden.protectedwp.safespace"  
    minSdk 30
    targetSdk 37
    versionCode 92
    versionName "92.0"  
}  

buildTypes {  
    release {  
        minifyEnabled false  
        shrinkResources false  
         }  
}

}

dependencies {
implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
}
